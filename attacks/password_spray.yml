id: password_spray
name: Password Spraying
category: credentials
mitre: T1110.003

description: |
  Password spraying e o tehnica low-and-slow: in loc sa incerci multe
  parole pentru un user (brute force, care declanseaza lockout), incerci
  o singura parola pentru multi useri. Astfel ramai sub threshold-ul
  de account lockout configurat in domain policy.

  Devine eficient cand domeniul are politica permisiva: parole scurte,
  fara complexitate, fara monitorizare a frecventei de log-on esuat la
  nivel de domeniu (doar la nivel de user).

  In acest atac folosim netexec impotriva SMB pe Domain
  Controller.

  Tool Kali: netexec

misconfiguration_general: |
  Politica de parola in Default Domain Policy:
    - Lungime minima mica (parole slabe permise)
    - Threshold de lockout permisiv sau dezactivat (LockoutThreshold = 0)
    - Audit Logon Events neactivat / nivel scazut

  Nota: in acest laborator LockoutThreshold = 0 (dezactivat intentionat)
  pentru a permite rulari repetate ale atacului fara blocare de conturi.
  Intr-un mediu real, un threshold mic (ex. 5) ar limita numarul de incercari.

  Comanda aplicata pe Windows Server:
    Set-ADDefaultDomainPasswordPolicy -LockoutThreshold 0

misconfiguration_specific: |
  Toti utilizatorii din lista de spray si parolele lor:
    - andrei.popescu  (Corp_Users)          -> kk123456$  (diferita)
    - mihai.popa      (Corp_Users)          -> kk12345$   [VULNERABIL]
    - ion.alexa       (Corp_Users)          -> kk12345$   [VULNERABIL]
    - emilia.lucescu  (Corp_Users)          -> kk12345$   [VULNERABIL]
    - diana.petrescu  (Corp_Users)          -> kk12345$   [VULNERABIL]
    - it.admin        (Corp_IT)             -> kkk12345$
    - it.support      (Corp_IT)             -> kkk12345$
    - svc.backup      (Corp_ServiceAccounts)-> kkkk12345$
    - svc.web         (Corp_ServiceAccounts)-> kkkk12345$

  Output asteptat: [+] pentru useri la care functioneaza parola
  [-] STATUS_LOGON_FAILURE pentru restul.

remediation: |
  1. Group Policy Management Console -> Default Domain Policy ->
     Computer Configuration -> Policies -> Windows Settings ->
     Account Policies -> Account Lockout Policy:
       - Account lockout threshold: 5
       - Account lockout duration: 30 min
       - Reset account lockout counter after: 30 min

  2. Account Policies -> Password Policy:
       - Minimum password length: 14
       - Password must meet complexity requirements: Enabled

  3. Restrictioneaza incercarile de autentificare la spatiul de adrese
     al organizatiei — blocarea conexiunilor externe reduce suprafata
     de atac in cazul spray-urilor remote.

  4. Activeaza monitorizare Wazuh pe Event ID 4625 (logon failure)
     cu praguri de frecventa pentru a detecta spraying.

parameters:
  - name: dc_ip
    label: "IP Domain Controller"
    default: "10.10.128.2"
    required: true
  - name: domain
    label: "Domeniul AD"
    default: "corp.local"
    required: true
  - name: spray_password
    label: "Parola de testat"
    default: "kk12345$"
    required: true

steps:
  - run_on: kali
    description: "Curata fisierele temporare din rulari anterioare"
    command: "rm -f /tmp/spray_users.txt"

  - run_on: kali
    description: "Pregateste lista de useri tinta"
    command: |
      printf '%s\n' andrei.popescu mihai.popa ion.alexa emilia.lucescu diana.petrescu it.admin it.support svc.backup svc.web > /tmp/spray_users.txt && cat /tmp/spray_users.txt

  - run_on: kali
    description: "Spray cu o singura parola peste toata lista (SMB)"
    command: "netexec smb {{dc_ip}} -u /tmp/spray_users.txt -p '{{spray_password}}' --continue-on-success 2>&1"
    expect_nonzero_ok: true

detection:
  wazuh_rules:
    - id: 92652
      description: "Successful Remote Logon via NTLM - credentiale valide gasite"
    - id: 60122
      description: "Logon Failure - Unknown user or bad password"
  mitre_technique: T1110.003
  mitre_description: "Brute Force: Password Spraying"
